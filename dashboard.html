<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2275%22 font-size=%2280%22 text-anchor=%22middle%22>%F0%9F%93%A1</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #58a6ff; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { color: #8b949e; font-size: 14px; margin-top: 0; margin-bottom: 20px; }

        .scan-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
        }
        button {
            background: #238636;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #2ea043; }
        button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #58a6ff;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-weight: bold; font-size: 16px; color: #f0f6fc; }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .badge-online { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }
        .card-ip { font-family: monospace; color: #8b949e; font-size: 13px; }
        
        #progress {
            font-size: 12px;
            color: #8b949e;
            margin: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 Nettverks-Dashboard</h1>
    <p class="subtitle">Søker automatisk etter aktive tjenester på lokalnettverket.</p>

    <div class="scan-bar">
        <label style="font-size:13px; font-weight:bold;">IP-Område:</label>
        <input type="text" id="ipPrefix" value="10.0.0.">
        <button id="scanBtn" onclick="startScan()">🔍 Skann Nettverk</button>
    </div>
    <div id="progress"></div>

    <div class="grid" id="nodeGrid">
        </div>
</div>

<script>
    // Portene du bruker på maskinene dine
    const KNOWN_PORTS = [
        { port: 6661, name: "🎨 XL Image Generator", defaultIcon: "🎨" },
        { port: 7071, name: "🖥️ Code History Vault", defaultIcon: "🖥️" },
        { port: 5005, name: "🎙️ Podcast Player", defaultIcon: "🎙️" },
        { port: 5001, name: "🤖 AI Assistant", defaultIcon: "🤖" },
    ];

    async function checkService(ip, portObj) {
        const url = `http://${ip}:${portObj.port}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200); // 1.2s timeout per sjekk

        try {
            // mode: 'no-cors' gjør at vi får vite om serveren svarer selv om den har CORS blokkering
            await fetch(url, { mode: 'no-cors', signal: controller.signal });
            clearTimeout(timeoutId);
            return { ip, port: portObj.port, name: portObj.name, url };
        } catch (err) {
            clearTimeout(timeoutId);
            return null;
        }
    }

    async function startScan() {
        const prefix = document.getElementById('ipPrefix').value.trim();
        const grid = document.getElementById('nodeGrid');
        const progress = document.getElementById('progress');
        const scanBtn = document.getElementById('scanBtn');

        grid.innerHTML = '';
        scanBtn.disabled = true;
        progress.innerText = "Skanner IP-er fra 1 til 254 på valgte porter...";

        const foundNodes = [];
        const promises = [];

        // Generer sjekker for 10.0.0.1 til 10.0.0.254 for alle portene dine
        for (let i = 1; i <= 254; i++) {
            const ip = `${prefix}${i}`;
            KNOWN_PORTS.forEach(portObj => {
                promises.push(
                    checkService(ip, portObj).then(result => {
                        if (result) {
                            addNodeCard(result);
                        }
                    })
                );
            });
        }

        await Promise.all(promises);

        progress.innerText = "Skanning fullført!";
        scanBtn.disabled = false;

        if (grid.children.length === 0) {
            grid.innerHTML = `<p style="color:#8b949e;">Ingen aktive tjenester funnet i ${prefix}1-254.</p>`;
        }
    }

    function addNodeCard(node) {
        const grid = document.getElementById('nodeGrid');
        
        // Sjekk om kortet allerede finnes
        if (document.getElementById(`node-${node.ip}-${node.port}`)) return;

        const a = document.createElement('a');
        a.id = `node-${node.ip}-${node.port}`;
        a.className = 'card';
        a.href = node.url;
        a.target = '_blank';

        a.innerHTML = `
            <div class="card-header">
                <span class="card-title">${node.name}</span>
                <span class="badge badge-online">ONLINE</span>
            </div>
            <div class="card-ip">${node.url}</div>
        `;

        grid.appendChild(a);
    }

    // Auto-start skann når du åpner fila
    window.onload = () => {
        startScan();
    };
</script>

</body>
</html>
