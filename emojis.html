<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #58a6ff; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { color: #8b949e; font-size: 14px; margin-top: 0; margin-bottom: 20px; }

        .scan-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
        }
        button {
            background: #238636;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #2ea043; }
        button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #58a6ff;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-weight: bold; font-size: 16px; color: #f0f6fc; }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .badge-online { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }
        .card-ip { font-family: monospace; color: #8b949e; font-size: 13px; }

        #progress {
            font-size: 12px;
            color: #8b949e;
            margin: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 Nettverks-Dashboard</h1>
    <p class="subtitle">Søker automatisk etter aktive tjenester på lokalnettverket.</p>

    <div class="scan-bar">
        <label style="font-size:13px; font-weight:bold;">IP-Område:</label>
        <input type="text" id="ipPrefix" value="10.0.0.">
        <button id="scanBtn" onclick="startScan()">🔍 Skann Nettverk</button>
    </div>
    <div id="progress"></div>

    <div class="grid" id="nodeGrid">
        </div>
</div>

<script>
    const KNOWN_PORTS = [
        { port: 8096, name: "🎬 Jellyfin Server", defaultIcon: "🍿" },
        { port: 6661, name: "🎨 Universal Studio Multi-GPU", defaultIcon: "⚡" },
        { port: 5000, name: "🖼️ SD 1.5 Studio", defaultIcon: "🎨" },
        { port: 5001, name: "🤖 Ollama AI Server", defaultIcon: "🧠" }
    ];

    async function checkService(ip, portObj) {
        const url = `http://${ip}:${portObj.port}`;
        const controller = new AbortController();
        // Økt timeout til 2.5 sekunder for å tåle Wi-Fi og svarmoduser
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        try {
            await fetch(url, { mode: 'no-cors', signal: controller.signal });
            clearTimeout(timeoutId);
            return { ip, port: portObj.port, name: portObj.name, url };
        } catch (err) {
            clearTimeout(timeoutId);
            return null;
        }
    }

    // Hjelpefunksjon for å kjøre i kontrollert puljestørrelse (Batching)
    async function mapConcurrent(items, limit, fn) {
        const results = [];
        const executing = [];
        for (const item of items) {
            const p = Promise.resolve().then(() => fn(item));
            results.push(p);
            if (limit <= items.length) {
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= limit) {
                    await Promise.race(executing);
                }
            }
        }
        return Promise.all(results);
    }

    async function startScan() {
        const prefix = document.getElementById('ipPrefix').value.trim();
        const grid = document.getElementById('nodeGrid');
        const progress = document.getElementById('progress');
        const scanBtn = document.getElementById('scanBtn');

        grid.innerHTML = '';
        scanBtn.disabled = true;
        progress.innerText = "Skanner nettverk i kontrollerte puljer...";

        // Lager en liste over alle sjekker som skal utføres
        const tasks = [];
        for (let i = 1; i <= 254; i++) {
            const ip = `${prefix}${i}`;
            KNOWN_PORTS.forEach(portObj => {
                tasks.push({ ip, portObj });
            });
        }

        // Kjører maks 40 forespørsler parallelt. 
        // Dette hindrer nettleseren fra å kvele sin egen tilkoblingskø!
        await mapConcurrent(tasks, 40, async (task) => {
            const result = await checkService(task.ip, task.portObj);
            if (result) {
                addNodeCard(result);
            }
        });

        progress.innerText = "Skanning fullført!";
        scanBtn.disabled = false;

        if (grid.children.length === 0) {
            grid.innerHTML = `<p style="color:#8b949e;">Ingen aktive tjenester funnet i ${prefix}1-254.</p>`;
        }
    }

    function addNodeCard(node) {
        const grid = document.getElementById('nodeGrid');

        if (document.getElementById(`node-${node.ip}-${node.port}`)) return;

        const a = document.createElement('a');
        a.id = `node-${node.ip}-${node.port}`;
        a.className = 'card';
        a.href = node.url;
        a.target = '_blank';

        a.innerHTML = `
            <div class="card-header">
                <span class="card-title">${node.name}</span>
                <span class="badge badge-online">ONLINE</span>
            </div>
            <div class="card-ip">${node.url}</div>
        `;

        grid.appendChild(a);
    }

    window.onload = () => {
        startScan();
    };
</script>

</body>
</html>
