<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Game</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface-color: #1a1a1a;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-radius: 0px;
            --grid-cols: 3;
            --grid-rows: 3;
            --bg-image: url('');
            --first-image: url('https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1024&h=1024&fit=crop');
            --aspect-ratio: 1 / 1; 
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }
        #ambient-bg {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            filter: blur(50px) brightness(0.2);
            z-index: 1;
            transition: background-image 1s ease-in-out;
            pointer-events: none;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            gap: 20px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #splash-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--first-image);
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.25) saturate(0.8);
            z-index: -1;
        }
        #splash-screen h2 {
            font-size: 54px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--primary-color);
            margin: 0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.7);
            text-transform: uppercase;
        }
        #splash-screen .link-text {
            font-size: 20px;
            margin: 0 0 10px 0;
        }
        #splash-screen .link-text a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 3px;
            transition: all 0.3s ease;
        }
        #splash-screen .link-text a:hover {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(187, 134, 252, 0.6);
        }
        .disclaimer {
            max-width: 500px;
            font-size: 13px;
            line-height: 1.6;
            color: #a0a0a0;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .disclaimer strong {
            color: #ff4a4a;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        button {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 18px 50px;
            border-radius: 30px;
            font-size: 19px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            opacity: 0.95;
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(187, 134, 252, 0.6);
        }
        .game-viewport {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-area {
            display: flex;
            background-color: rgba(0, 0, 0, 0.8);
            overflow: hidden;
            width: 95vw;
            height: 85vh;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }
        #puzzle-board {
            height: 100%;
            aspect-ratio: var(--aspect-ratio); 
            background-color: var(--surface-color);
            position: relative;
            box-sizing: border-box;
            border-right: 4px solid rgba(0, 0, 0, 0.7);
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), 1fr);
            grid-template-rows: repeat(var(--grid-rows), 1fr);
            background-size: 100% 100%;
            flex-shrink: 0;
        }
        #puzzle-board.solved {
            background-image: var(--bg-image);
        }
        #puzzle-board.solved .board-slot {
            opacity: 0;
        }
        .board-slot {
            border: 1px dashed rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
            position: relative;
            width: 100%;
            height: 100%;
            transition: background-color 0.2s ease;
        }
        .board-slot.drag-over {
            background-color: rgba(187, 134, 252, 0.25);
        }
        #scatter-area {
            flex-grow: 1; 
            position: relative;
            overflow: hidden;
            background-color: rgba(5, 5, 5, 0.6);
        }
        .puzzle-piece {
            width: calc(100% / var(--grid-cols));
            height: calc(100% / var(--grid-rows));
            background-image: var(--bg-image);
            background-size: calc(var(--grid-cols) * 100%) calc(var(--grid-rows) * 100%);
            background-position:
                calc(var(--x) * 100% / max(1, var(--grid-cols) - 1))
                calc(var(--y) * 100% / max(1, var(--grid-rows) - 1));
            border: 1px solid rgba(255,255,255,0.25);
            box-sizing: border-box;
            cursor: grab;
            position: absolute;
            box-shadow: 4px 6px 15px rgba(0,0,0,0.6);
        }
        .board-slot .puzzle-piece {
            width: 100%;
            height: 100%;
            left: 0 !important;
            top: 0 !important;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .puzzle-piece:active { cursor: grabbing; }
        .puzzle-piece.dragging {
            opacity: 0.5;
            transform: scale(1.03);
            z-index: 1000 !important;
        }
        #ui-overlay {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: 100%;
        }
        #message {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px var(--primary-color), 0 4px 12px rgba(0,0,0,0.9);
            min-height: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }
        #nextBtn {
            pointer-events: auto;
            display: none;
            animation: pulse 2s infinite;
            padding: 14px 40px;
            font-size: 16px;
        }
        #exitBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1600;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        #exitBtn:hover {
            background-color: #ff4a4a;
            border-color: #ff4a4a;
            color: #fff;
            transform: translateY(-2px);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #flash-transition {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="flash-transition"></div>
    <div id="ambient-bg"></div>
    <button id="exitBtn" style="display: none;">Exit Game</button>
    <div id="splash-screen">
        <h2>Jungle Fever</h2>
        <!-- <p class="link-text"><a href="https://sexypuzzle.itch.io" target="_blank">sexypuzzle.itch.io</a></p> -->
        <button id="startPuzzleBtn">Start Game</button>
        <div class="disclaimer">
            <strong>ADULT ONLY (18+)</strong>
            This game contains explicit sexual content and nudity. All characters depicted in this game are fictional models and are 18 years of age or older.
        </div>
    </div>
    <div class="game-viewport">
        <div class="game-area">
            <div id="puzzle-board"></div>
            <div id="scatter-area"></div>
        </div>
    </div>
    <div id="ui-overlay">
        <div id="message"></div>
        <button id="nextBtn">Advance to Next Level</button>
    </div>
    <script>
        const puzzleImages = [
            'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1024&h=1024&fit=crop',
            'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1024&h=1024&fit=crop',
            'https://images.unsplash.com/photo-1604871000636-074fa5117945?q=80&w=1024&h=1024&fit=crop',
            'https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=1024&h=1024&fit=crop'
        ];

        const GRID_COLS = 3;
        const GRID_ROWS = 3;

        let currentLevelIndex = parseInt(localStorage.getItem('savedPuzzleLevel')) || 0;
        if (currentLevelIndex >= puzzleImages.length) {
            currentLevelIndex = 0;
        }

        document.documentElement.style.setProperty('--first-image', `url(${puzzleImages[currentLevelIndex]})`);

        let draggedPiece = null;
        let isPlaying = false;
        let topZIndex = 100;
        const board = document.getElementById('puzzle-board');
        const scatterArea = document.getElementById('scatter-area');
        const messageDiv = document.getElementById('message');
        const nextBtn = document.getElementById('nextBtn');
        const splashScreen = document.getElementById('splash-screen');
        const flashEffect = document.getElementById('flash-transition');
        const exitBtn = document.getElementById('exitBtn');
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'grab') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + index * 0.08);
                    g.gain.setValueAtTime(0.1, now + index * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.4);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + index * 0.08);
                    o.stop(now + index * 0.08 + 0.4);
                });
            }
        }

        function buildLevelMarkup(width, height, imgUrl) {
            document.documentElement.style.setProperty('--aspect-ratio', `${width} / ${height}`);
            document.documentElement.style.setProperty('--grid-cols', GRID_COLS);
            document.documentElement.style.setProperty('--grid-rows', GRID_ROWS);
            document.documentElement.style.setProperty('--bg-image', `url(${imgUrl})`);
            
            for (let y = 0; y < GRID_ROWS; y++) {
                for (let x = 0; x < GRID_COLS; x++) {
                    const id = `piece-${x}-${y}`;
                    const slot = document.createElement('div');
                    slot.classList.add('board-slot');
                    slot.dataset.targetId = id;
                    setupSlotEvents(slot);
                    board.appendChild(slot);

                    const piece = document.createElement('div');
                    piece.classList.add('puzzle-piece');
                    piece.style.aspectRatio = `${width} / ${height}`;
                    piece.draggable = true;
                    piece.dataset.id = id;
                    piece.style.setProperty('--x', x);
                    piece.style.setProperty('--y', y);
                    setupPieceEvents(piece);
                    placeInScatterArea(piece);
                    scatterArea.appendChild(piece);
                }
            }
        }

        function startCurrentLevel() {
            board.innerHTML = '';
            board.classList.remove('solved');
            scatterArea.innerHTML = '';
            messageDiv.innerText = '';
            nextBtn.style.display = 'none';
            isPlaying = true;
            topZIndex = 100;
            
            const currentImgUrl = puzzleImages[currentLevelIndex];
            const img = new Image();
            img.src = currentImgUrl;
            
            if (img.complete) {
                buildLevelMarkup(img.naturalWidth, img.naturalHeight, currentImgUrl);
            } else {
                img.onload = function() {
                    buildLevelMarkup(img.naturalWidth, img.naturalHeight, currentImgUrl);
                };
                // Fallback i tilfelle lastefeil (bruker kvadratisk)
                img.onerror = function() {
                    buildLevelMarkup(1000, 1000, currentImgUrl);
                };
            }
        }

        function placeInScatterArea(piece) {
            const maxPercentX = 70; 
            const maxPercentY = 75;
            const randomX = Math.random() * maxPercentX;
            const randomY = Math.random() * maxPercentY;
            piece.style.left = `${randomX}%`;
            piece.style.top = `${randomY}%`;
            piece.style.zIndex = Math.floor(Math.random() * 50);
        }

        function setupPieceEvents(piece) {
            piece.addEventListener('mousedown', () => {
                topZIndex++;
                piece.style.zIndex = topZIndex;
            });
            piece.addEventListener('dragstart', (e) => {
                if (!isPlaying) { e.preventDefault(); return; }
                initAudio();
                draggedPiece = piece;
                piece.classList.add('dragging');
                playSound('grab');
                e.dataTransfer.setData('text/plain', piece.dataset.id);
                e.dataTransfer.effectAllowed = 'move';
            });
            piece.addEventListener('dragend', () => {
                piece.classList.remove('dragging');
                draggedPiece = null;
            });
        }

        function setupSlotEvents(slot) {
            slot.addEventListener('dragover', (e) => {
                e.preventDefault();
                slot.classList.add('drag-over');
            });
            slot.addEventListener('dragleave', () => {
                slot.classList.remove('drag-over');
            });
            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                slot.classList.remove('drag-over');
                if (draggedPiece) {
                    playSound('drop');
                    let targetSlot = e.target.classList.contains('puzzle-piece')
                        ? e.target.parentElement
                        : e.target;
                    if (targetSlot.children.length > 0 && targetSlot.children[0] !== draggedPiece) {
                        const existingPiece = targetSlot.children[0];
                        scatterArea.appendChild(existingPiece);
                        placeInScatterArea(existingPiece);
                    }
                    targetSlot.appendChild(draggedPiece);
                    draggedPiece.style.zIndex = 1;
                    draggedPiece.style.width = "100%";
                    draggedPiece.style.height = "100%";
                    checkWin();
                }
            });
        }

        scatterArea.addEventListener('dragover', (e) => e.preventDefault());
        scatterArea.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedPiece) {
                playSound('drop');
                const rect = scatterArea.getBoundingClientRect();
                const pieceWidth = rect.width / GRID_COLS;
                const pieceHeight = rect.height / GRID_ROWS;
                
                let pxX = e.clientX - rect.left - (pieceWidth / 2);
                let pxY = e.clientY - rect.top - (pieceHeight / 2);
                pxX = Math.max(0, Math.min(pxX, rect.width - pieceWidth));
                pxY = Math.max(0, Math.min(pxY, rect.height - pieceHeight));
                
                const percentX = (pxX / rect.width) * 100;
                const percentY = (pxY / rect.height) * 100;
                
                draggedPiece.style.width = `calc(100% / ${GRID_COLS})`;
                draggedPiece.style.height = `calc(100% / ${GRID_ROWS})`;
                draggedPiece.style.left = `${percentX}%`;
                draggedPiece.style.top = `${percentY}%`;
                scatterArea.appendChild(draggedPiece);
            }
        });

        function checkWin() {
            const slots = document.querySelectorAll('.board-slot');
            let isWin = true;
            slots.forEach(slot => {
                if (slot.children.length === 0) {
                    isWin = false;
                } else {
                    const piece = slot.children[0];
                    if (slot.dataset.targetId !== piece.dataset.id) {
                        isWin = false;
                    }
                }
            });
            if (isWin) {
                isPlaying = false;
                playSound('win');
                board.classList.add('solved');
                if (currentLevelIndex < puzzleImages.length - 1) {
                    messageDiv.innerText = `Level ${currentLevelIndex + 1} Complete!`;
                    nextBtn.style.display = 'block';
                } else {
                    messageDiv.innerText = 'Ultimate Puzzle Master! You have unlocked everything!';
                }
            }
        }

        document.getElementById('startPuzzleBtn').addEventListener('click', () => {
            initAudio();
            const docEl = document.documentElement;
            
            // Prøver å aktivere fullskjerm. Hvis nettleseren nekter, fanges feilen opp uten å krasje spillet.
            try {
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen().catch(()=>{});
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                } else if (docEl.mozRequestFullScreen) {
                    docEl.mozRequestFullScreen();
                } else if (docEl.msRequestFullscreen) {
                    docEl.msRequestFullscreen();
                }
            } catch(e) {
                console.log("Fullscreen request bypassed or blocked.");
            }

            splashScreen.style.transition = 'opacity 0.5s ease';
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.style.display = 'none';
                exitBtn.style.display = 'block';
                startCurrentLevel();
            }, 500);
        });

        nextBtn.addEventListener('click', () => {
            flashEffect.style.opacity = '1';
            setTimeout(() => {
                currentLevelIndex++;
                localStorage.setItem('savedPuzzleLevel', currentLevelIndex);
                startCurrentLevel();
                flashEffect.style.opacity = '0';
            }, 500);
        });

        exitBtn.addEventListener('click', () => {
            try {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            } catch(e) {}
            window.location.href = "https://sexypuzzle.itch.io";
        });
    </script>
</body>
</html>
